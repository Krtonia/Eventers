mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodbDriverSync" }
mongodb-kotlin-driver = { module = "org.mongodb:mongodb-kotlin-driver", version.ref = "mongodbKotlinDriver" }
mongodb-kotlin-serialization = { module = "org.mongodb:mongodb-kotlin-serialization", version.ref = "mongodbKotlinSerialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

